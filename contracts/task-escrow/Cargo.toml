[package]
name = "task-escrow"
version = "0.1.0"
edition = "2021"
publish = false
description = "Soroban task escrow for Stellar ROS Bridge"

# The contract is its own workspace so Soroban dependencies stay out of the
# bridge crates' lockfile.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "28.0.0"

[dev-dependencies]
soroban-sdk = { version = "28.0.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
