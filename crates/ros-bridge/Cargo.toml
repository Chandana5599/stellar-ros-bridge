[package]
name = "ros-bridge"
description = "ROS 2 integration for Stellar ROS Bridge."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["rosbridge"]
rosbridge = ["dep:tungstenite"]
ros = ["dep:rclrs"]

[dependencies]
bridge-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
tungstenite = { version = "0.29", optional = true }
rclrs = { version = "0.8", optional = true }

[package.metadata.docs.rs]
all-features = true
